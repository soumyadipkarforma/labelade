name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # 3.11 = NVDA 2025.x, 3.13 = NVDA 2026.x
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ruff==0.17.6
      - run: ruff check .
      - run: python -m unittest discover -v
      - run: python scripts/validate_packs.py
      - run: python tools/build.py
      - if: matrix.os == 'windows-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: labelade-addon
          path: dist/*.nvda-addon
