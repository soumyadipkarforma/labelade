name: Release

# Push a tag like v0.1.0 (matching ADDON["version"] in tools/build.py) to publish the add-on.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover
      - name: Build and check the version matches the tag
        shell: bash
        run: |
          out=$(python tools/build.py)
          echo "$out"
          file=$(echo "$out" | cut -d' ' -f1)
          [[ "$file" == *"labelade-${GITHUB_REF_NAME#v}.nvda-addon" ]] || { echo "tag does not match version"; exit 1; }
          # The .nvda-addon is already a zip; the .zip copy is for installing by hand into NVDA's addons folder.
          zip="${file%.nvda-addon}.zip"
          cp "$file" "$zip"
          (cd dist && sha256sum *.nvda-addon *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "FILE=$file" >> "$GITHUB_ENV"
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$FILE" "$ZIP" dist/SHA256SUMS.txt --title "Labelade $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
